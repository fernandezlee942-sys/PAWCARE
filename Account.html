<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare - Login & Register</title>
    <link rel="stylesheet" href="Style/Account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Style/HomeStyle.css">
</head>
<body>

    <!-- #region BannerTop -->
        <header id="Banner">
            <img src="logo/logo1.png" alt="Logo1" id="Logo1Img">
            <h1 style="font-size: 3vw;">Pawcare</h1>
            
            <div class="TopRightDivBanner">
                <a href="#Location">
                    <img src="logo/lokasi.png" alt="Lokasi" id="LokasiImg">
                </a>
                <a href="Account.html">
                    <img src="logo/akun.png" alt="Akun" id="AkunImg">
                </a>
            </div>
        </header>
    <!-- #endregion -->


    <div class="container ContentWrapper">
        <div class="form-box" id="login-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Masuk ke akun Anda</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Masukkan email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="switch-form">Belum punya akun? <a href="#" id="go-to-register">Daftar di sini</a></p>
            </form>
        </div>

        <div class="form-box hidden" id="register-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Buat akun baru</p>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Masukkan nama Anda">
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Masukkan email">
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Buat password">
                </div>

                <!-- Tambahan Pilihan Role -->
                <div class="input-group">
                    <label for="reg-role">Daftar Sebagai</label>
                    <select id="reg-role" required>
                        <option value="" disabled selected>-- Pilih Peran --</option>
                        <option value="user">User / Pemilik Hewan</option>
                        <option value="staff_groomer">Staff Groomer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn">Register</button>
                <p class="switch-form">Sudah punya akun? <a href="#" id="go-to-login">Login di sini</a></p>
            </form>
        </div>
    </div>
    <!-- #region BannerBottom -->
    <nav id="BannerBottom">
        <a href="Layanan.html">
            <img src="logo/logo2.png" alt="MainPg" id="MainPgImg">
        </a>
        <a href="index.html#produk">
            <img src="logo/Troli.png" alt="Troli" id="TroliImg">
        </a>
        <a href="index.html">
            <img src="logo/home.png" alt="Home" id="HomeImg">
        </a>
        <a href="vet.html">
            <img src="logo/layanan.png" alt="Home" id="LayananImg">
        </a>
        <a href="index.html#Contact">
            <img src="logo/contactperson.png" alt="Contact" id="ContactImg">
        </a>
    </nav>

    <!-- #endregion -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Pakai toLowerCase() agar tidak sensitif huruf besar/kecil (CatLoading vs catloading)
    const currentPath = window.location.pathname.toLowerCase();
    const isLoadingPage = currentPath.includes("catloading.html");

    console.log("[DEBUG] Path saat ini:", currentPath);
    console.log("[DEBUG] Apakah Halaman Loading?:", isLoadingPage);

    if (isLoadingPage) {
        const nextPage = sessionStorage.getItem("nextPage");
        console.log("[DEBUG] nextPage yang dibaca dari sessionStorage:", nextPage);

        // Jika nextPage kosong/null
        if (!nextPage) {
            console.warn("[DEBUG] nextPage KOSONG! Menunggu 3 detik lalu balik ke halaman utama.");
        }

        setTimeout(() => {
            console.log("[DEBUG] Timer 3 detik selesai!");
            sessionStorage.removeItem("nextPage");

            if (nextPage) {
                console.log("[DEBUG] Berpindah ke:", nextPage);
                window.location.replace(nextPage);
            } else {
                // Ganti dengan URL halaman utama Anda jika null
                console.log("[DEBUG] Berpindah ke fallback / atau index.html");
                window.location.replace("/"); 
            }
        }, 2000);

        return;
    }

    // Penanganan Klik Link
    document.querySelectorAll("a[href]").forEach(link => {
        link.addEventListener("click", event => {
            if (
                event.defaultPrevented ||
                event.button !== 0 ||
                link.target === "_blank" ||
                link.hasAttribute("download") ||
                event.ctrlKey ||
                event.shiftKey ||
                event.altKey ||
                event.metaKey
            ) return;

            const destination = new URL(link.href, window.location.href);

            if (
                destination.origin !== window.location.origin ||
                destination.pathname.toLowerCase().includes("catloading.html") ||
                (destination.pathname === window.location.pathname && destination.hash)
            ) return;

            event.preventDefault();

            console.log("[DEBUG] Menyimpan nextPage:", destination.href);
            sessionStorage.setItem("nextPage", destination.href);

            // Redirect ke halaman loading
            window.location.href = new URL("CatLoading.html", window.location.href).href;
        });
    });
});
</script>


    <script src="js/Account.js"></script>
</body>
</html>
