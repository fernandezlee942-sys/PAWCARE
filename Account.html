<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare - Login & Register</title>
    <link rel="stylesheet" href="Account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="form-box" id="login-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Masuk ke akun Anda</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Masukkan email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="switch-form">Belum punya akun? <a href="#" id="go-to-register">Daftar di sini</a></p>
            </form>
        </div>

        <div class="form-box hidden" id="register-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Buat akun baru</p>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Masukkan nama Anda">
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Masukkan email">
                </div>
                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Buat password">
                </div>
                <button type="submit" class="btn">Register</button>
                <p class="switch-form">Sudah punya akun? <a href="#" id="go-to-login">Login di sini</a></p>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBox = document.getElementById('login-box');
            const registerBox = document.getElementById('register-box');
            const goToRegister = document.getElementById('go-to-register');
            const goToLogin = document.getElementById('go-to-login');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            goToRegister.addEventListener('click', (e) => {
                e.preventDefault();
                loginBox.classList.add('hidden');
                registerBox.classList.remove('hidden');
            });

            goToLogin.addEventListener('click', (e) => {
                e.preventDefault();
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                window.location.href = 'Home.html';
            });

            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                registerForm.reset();
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
