<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare - Login & Register</title>
    <link rel="stylesheet" href="Style/Account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Style/HomeStyle.css">


<!-- note im too lazy to even use the account stylesheet so plz bear with this -->
<style>

:root {
    --bg: #FFF7F4;
    --pink-light: #FFF0F5;
    --pink-soft: #FDE0E8;
    --pink: #F4A7BC;
    --pink-strong: #D96C91;
    --pink-dark: #A84368;
    --text: #4A2A36;
    --line: #F2D5DF;
}

body {
    background-color: var(--bg);
    color: var(--text);
}

#Banner {
    background-color: var(--pink-soft);
    border-color: var(--pink-strong);
}

#BannerBottom {
    background-color: var(--pink-light);
    border-color: var(--pink-strong);
}

.form-box {
    background-color: #FFFFFF;
}

.form-box .header h2,
.form-box .header i {
    color: var(--pink-dark);
}

.input-group input,
.input-group select {
    background-color: #FFFFFF;
    border: 1px solid var(--line);
    color: var(--text);
}

.input-group input:focus,
.input-group select:focus {
    outline: 2px solid var(--pink);
    border-color: var(--pink-strong);
}

.btn {
    background-color: var(--pink-strong);
    border: 1px solid var(--pink-strong);
    color: #FFFFFF;
}

.btn:hover {
    background-color: var(--pink-dark);
    border-color: var(--pink-dark);
}

.switch-form a {
    color: var(--pink-dark);
}

.switch-form a:hover {
    color: var(--pink-strong);
}

input::placeholder {
    color: #B99AA5;
}

a {
    transition: color 0.2s ease;
}

</style>

</head>
<body>

    <!-- #region BannerTop -->
        <header id="Banner">
            <img src="logo/logo1.png" alt="Logo1" id="Logo1Img">
            <h1 style="font-size: 3vw;">Pawcare</h1>
            
            <div class="TopRightDivBanner">
                <a href="#Location">
                    <img src="logo/lokasi.png" alt="Lokasi" id="LokasiImg">
                </a>
                <a href="Account.html">
                    <img src="logo/akun.png" alt="Akun" id="AkunImg">
                </a>
            </div>
        </header>
    <!-- #endregion -->


    <div class="container ContentWrapper">
        <div class="form-box" id="login-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Masuk ke akun Anda</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Masukkan email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="switch-form">Belum punya akun? <a href="#" id="go-to-register">Daftar di sini</a></p>
            </form>
        </div>

        <div class="form-box hidden" id="register-box">
            <div class="header">
                <h2><i class="fas fa-paw"></i> PawCare</h2>
                <p>Buat akun baru</p>
            </div>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Masukkan nama Anda">
                </div>

                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="Masukkan email">
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required placeholder="Buat password">
                </div>

                <!-- Tambahan Pilihan Role -->
                <div class="input-group">
                    <label for="reg-role">Daftar Sebagai</label>
                    <select id="reg-role" required>
                        <option value="" disabled selected>-- Pilih Peran --</option>
                        <option value="user">User / Pemilik Hewan</option>
                        <option value="staff_groomer">Staff Groomer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn">Register</button>
                <p class="switch-form">Sudah punya akun? <a href="#" id="go-to-login">Login di sini</a></p>
            </form>
        </div>
    </div>
    <!-- #region BannerBottom -->
    <nav id="BannerBottom">
        <a href="Layanan.html">
            <img src="logo/logo2.png" alt="MainPg" id="MainPgImg">
        </a>
        <a href="index.html#produk">
            <img src="logo/Troli.png" alt="Troli" id="TroliImg">
        </a>
        <a href="index.html">
            <img src="logo/home.png" alt="Home" id="HomeImg">
        </a>
        <a href="vet.html">
            <img src="logo/layanan.png" alt="Home" id="LayananImg">
        </a>
        <a href="index.html#Contact">
            <img src="logo/contactperson.png" alt="Contact" id="ContactImg">
        </a>
    </nav>

    <!-- #endregion -->
<script src="js/LoadScreen.js"></script>


    <script src="js/Account.js"></script>
</body>
</html>
