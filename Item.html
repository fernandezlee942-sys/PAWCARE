<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" href="logo/logo3.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare-Main Page</title>
    <link rel="stylesheet" href="ItemStyle.css">
    <style>
        :root {
            --salmon: #f5b3a0;
            --peach: #fddccf;
            --pink: #fbd3e1;
            --cream: #fdecd6;
            --border: #f3dcd3;
            --brown: #3b1f1f;
            --terracotta: #c8553d;
            --muted: #8a6a66;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--brown);
            background: #fff;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        .hero {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--peach) url('img/DogSlipper.jpg') center / cover no-repeat;
            border-radius: 0 0 24px 24px;
        }
        .hero .icon {
            position: absolute; top: 16px;
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(255,255,255,.85);
            border: 1px solid var(--border);
            display: grid; place-items: center;
            cursor: pointer;
        }
        .hero .icon img { width: 24px; height: 24px; object-fit: contain; }
        .hero .left  { left: 16px; }

        .info { padding: 18px 20px 8px; }
        .price {
            font-size: 28px; font-weight: 700; color: var(--terracotta);
        }

        .box {
            margin: 12px 20px 0;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
        }
        .box h3 { font-size: 15px; margin-bottom: 6px; }
        .box p  { font-size: 14px; line-height: 1.55; color: var(--brown); }

        .qty-row {
            margin: 12px 20px 0;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 14px;
        }
        .qty { display: flex; align-items: center; gap: 12px; }
        .qty button {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--cream);
            font-size: 18px; color: var(--brown); cursor: pointer;
        }
        .qty span { min-width: 20px; text-align: center; font-weight: 600; }

        .bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 68px;
            display: flex; align-items: center; gap: 8px;
            padding: 0 12px;
            background: #fff;
            border-top: 1px solid var(--border);
        }
        .bar .tool {
            flex: 0 0 48px; height: 48px; border-radius: 14px;
            background: var(--peach); border: 0; cursor: pointer;
            display: grid; place-items: center; position: relative;
        }
        .bar .tool svg {
            width: 24px; height: 24px; fill: none; stroke: var(--terracotta);
            stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
        }
        .bar .tool .badge {
            position: absolute; top: -4px; right: -4px;
            min-width: 18px; height: 18px; border-radius: 9px;
            background: var(--terracotta); color: #fff; font-size: 11px;
            display: none; place-items: center; padding: 0 4px;
        }
        .bar .total { flex: 1; line-height: 1.2; padding-left: 4px; }
        .bar .total small { display: block; font-size: 12px; color: var(--muted); }
        .bar .total b { font-size: 17px; }
        .bar .order {
            flex: 0 0 auto; height: 48px; padding: 0 24px;
            border: 0; border-radius: 24px;
            background: var(--terracotta); color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .bar .order:hover { background: #b2452f; }

        .toast {
            position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
            background: var(--brown); color: #fff; padding: 10px 18px;
            border-radius: 20px; font-size: 14px; opacity: 0;
            pointer-events: none; transition: opacity .2s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="hero">
        <button class="icon left" id="back" aria-label="Kembali"><img src="../img/BearCursor.png" alt="Kembali"></button> 
    </div>

    <div class="info">
        <div class="price" id="price">Rp 10.000</div>
    </div>

    <div class="box">
        <h3>Nama Item</h3>
        <p>sendal hasil maling dari tetangga</p>
    </div>

    <div class="qty-row">
        <span>Jumlah</span>
        <div class="qty">
            <button id="minus" aria-label="Kurangi">−</button>
            <span id="qty">1</span>
            <button id="plus" aria-label="Tambah">+</button>
        </div>
    </div>

    <div class="bar">
        <button class="tool" id="chat" aria-label="Chat admin">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.500 10h7"/></svg>
        </button>
        <button class="tool" id="cart" aria-label="Troli">
            <svg viewBox="0 0 24 24"><path d="M2 3h3l3 12h10l3-8H7"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
            <span class="badge" id="badge">0</span>
        </button>
        <div class="total">
            <small>Total harga</small>
            <b id="total">Rp 10.000</b>
        </div>
        <button class="order" id="order">Pesan</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        document.getElementById('back').onclick = () => history.back();

        const PRICE = 10000;
        let qty = 1, inCart = 0;
        const rp = n => 'Rp ' + n.toLocaleString('id-ID');

        function render() {
            document.getElementById('qty').textContent = qty;
            document.getElementById('total').textContent = rp(PRICE * qty);
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        document.getElementById('plus').onclick  = () => { qty++; render(); };
        document.getElementById('minus').onclick = () => { if (qty > 1) qty--; render(); };

        document.getElementById('chat').onclick = () => showToast('Membuka chat dengan admin...');
        document.getElementById('cart').onclick = () => {
            inCart += qty;
            const b = document.getElementById('badge');
            b.textContent = inCart;
            b.style.display = 'grid';
            showToast('Masuk troli: ' + qty + ' item');
        };
        document.getElementById('order').onclick = () =>
            showToast('Pesanan dibuat. Total ' + rp(PRICE * qty));
    </script>
</body>
</html>
